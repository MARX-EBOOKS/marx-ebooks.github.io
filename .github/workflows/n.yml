# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main","SSGtest","reader-test"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'              # 根据项目需要修改版本
          cache: 'npm'                    # 缓存 npm 依赖，加速构建

      - name: 构建项目
        run: node build11.js --skip docs/MEGA/,docs/MEW/,docs/reader.html --logo '/favicon.ico' --logotext 'MLCLASSIC'

      - name: 上传构建产物（供后续部署使用）
        uses: actions/upload-pages-artifact@v3
        with:
          # 请将下面的路径改为你的项目构建输出目录
          # 常见目录：'./dist'、'./build'、'./public'、'./.vitepress/dist' 等
          path: './dist'

  # ---------- 部署任务 ----------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build                         # 等待 build 任务成功完成
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5